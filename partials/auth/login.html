<!-- 1. LOGIN WRAPPER -->
    <div id="loginWrapper" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow-y: auto; width: 100%; padding: 40px 10px;">
        <div class="glass-card login-card" style="width: 480px; padding: 40px; border-radius: 24px; box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.4); text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); position: relative; z-index: 10;">
            <h2 style="font-weight: 800; margin-bottom: 5px; background: linear-gradient(135deg, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                ResumeX
            </h2>
            <p style="color: var(--text-secondary); margin-bottom: 25px; font-size: 15px; font-weight: 500;">
                AI Resume Screening Portal
            </p>

            <div class="d-flex mb-4" style="background: rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 4px; border: 1px solid rgba(255,255,255,0.05);">
                <button type="button" id="tab-candidate" class="btn w-50" onclick="setLoginRole('candidate')"
                    style="border-radius: 8px; border: none; font-weight: 600; padding: 10px; color: white; background: #0072ff; transition: 0.3s;">
                    Candidate
                </button>
                <button type="button" id="tab-official" class="btn w-50" onclick="setLoginRole('official')"
                    style="border-radius: 8px; border: none; font-weight: 600; padding: 10px; color: var(--text-secondary); background: transparent; transition: 0.3s;">
                    Official
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Username</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                </div>

                <div id="loginError" class="text-danger mb-3" style="display: none; font-size: 14px; font-weight: 500; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 77, 77, 0.2);">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3" style="border-radius: 12px; font-weight: 600; font-size: 16px;">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Portal
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Full Name</label>
                    <input type="text" id="registerName" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Email Address</label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email address" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Username</label>
                    <input type="text" id="registerUsername" class="form-control" placeholder="Choose a username" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Password</label>
                    <input type="password" id="registerPassword" class="form-control" placeholder="Choose a password" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label" style="font-size: 13px; font-weight: 500; margin-left: 4px;">Register As</label>
                    <select id="registerRole" class="form-select">
                        <option value="candidate" style="background: #0f172a; color: white;">Candidate</option>
                    </select>
                </div>

                <div id="registerError" class="text-danger mb-3" style="display: none; font-size: 14px; font-weight: 500; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 77, 77, 0.2);"></div>
                <div id="registerSuccess" class="text-success mb-3" style="display: none; font-size: 14px; font-weight: 500; background: rgba(0, 176, 155, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(0, 176, 155, 0.2);"></div>

                <button type="submit" class="btn btn-success w-100 py-3" style="border-radius: 12px; font-weight: 600; font-size: 16px;">
                    <i class="bi bi-person-plus-fill me-2"></i>Create Account
                </button>
            </form>

            <div class="mt-4" id="loginToggleArea">
                <a href="javascript:void(0)" onclick="toggleAuthForm('register')" style="color: #00c6ff; text-decoration: none; font-size: 14px; font-weight: 500;">
                    Don't have an account? Register here
                </a>
            </div>
            <div class="mt-4" id="registerToggleArea" style="display: none;">
                <a href="javascript:void(0)" onclick="toggleAuthForm('login')" style="color: #00c6ff; text-decoration: none; font-size: 14px; font-weight: 500;">
                    Already have an account? Login here
                </a>
            </div>

            <!-- Demo Access Panel -->
            <div class="mt-4" style="font-size: 12.5px; color: #94a3b8; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: left;">
                <strong style="color: #e2e8f0; display: block; margin-bottom: 2px;">Note:</strong>
                <span id="demo-credentials" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Candidates must register. Official: <b style="color: #00c6ff;">official</b> / <b style="color: #00c6ff;">Admin@123</b></span>
                </span>
            </div>

            <!-- Dynamic Job Openings Preview (Candidate Login only) -->
            <div id="loginOpeningsPreview" class="mt-4 text-start" style="display: block;">
                <h6 class="text-info fw-bold mb-2" style="font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px;">
                    <i class="bi bi-briefcase-fill text-info"></i> Current Open Positions
                </h6>
                <div id="loginJdList" style="max-height: 180px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; background: rgba(0,0,0,0.15);">
                    <p class="text-muted text-center m-0" style="font-size: 12px; padding: 10px;">Loading active openings...</p>
                </div>
            </div>
        </div>
    </div>
