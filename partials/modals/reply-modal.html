<!-- 3. EMAIL REPLY MODAL (SELF-CONTAINED CSS OVERLAY) -->
    <div id="replyModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 10500; justify-content: center; align-items: center;">
        <div class="glass-card" style="width: 540px; max-width: 90%; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 25px 60px rgba(0,0,0,0.6); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; padding: 0;">
            <div style="background: linear-gradient(to right, #0072ff, #00c6ff); padding: 18px 24px; display: flex; justify-content: space-between; align-items: center;">
                <h5 style="margin: 0; font-weight: 700; color: white; font-size: 17px;"><i class="bi bi-reply-fill me-2"></i>Reply to Candidate</h5>
                <button onclick="closeReplyModal()" style="background: none; border: none; color: white; cursor: pointer; padding: 0; font-size: 24px; display: flex; align-items: center;">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="text-start" style="padding: 24px; overflow-y: auto; max-height: 80vh;">
                <!-- Message context -->
                <div class="mb-4 p-3 rounded" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
                    <div style="font-size: 11px; color: #00c6ff; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px;">Original Message:</div>
                    <div id="replyOriginalSender" class="fw-bold text-light" style="font-size: 13.5px;">From: John Doe (john@example.com)</div>
                    <div id="replyOriginalSubject" class="fw-semibold text-info mt-1" style="font-size: 12.5px;">Subject: Inquiry</div>
                    <div id="replyOriginalMessage" class="mt-2 text-muted" style="white-space: pre-wrap; font-size: 13px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.15); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02);">Message content here...</div>
                </div>

                <form id="replyForm" onsubmit="submitReply(event)">
                    <input type="hidden" id="replyEmailId" />
                    <div class="mb-3">
                        <label class="form-label">To Address</label>
                        <input type="text" id="replyToEmail" class="form-control" readonly style="background: rgba(255,255,255,0.02); color: #94a3b8; border-color: rgba(255,255,255,0.04);" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject Header</label>
                        <input type="text" id="replySubject" class="form-control" required placeholder="Subject of reply" />
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Draft Message Reply</label>
                        <textarea id="replyMessageText" class="form-control" rows="5" required placeholder="Type your professional response to candidate here..." style="border-radius: 12px; resize: none;"></textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-secondary px-4 py-2.5" onclick="closeReplyModal()" style="border-radius: 10px;">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4 py-2.5" style="border-radius: 10px;"><i class="bi bi-send-fill me-2"></i>Send Reply</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
