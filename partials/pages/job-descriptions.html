<!-- =======================================
                         E. JOB DESCRIPTIONS PAGE (OFFICIAL)
                         ======================================= -->
                    <div id="job-descriptions-page" class="page">
                        <h2 class="section-title fw-bold text-light mb-4"><i class="bi bi-briefcase text-success me-2"></i>Job Description Management</h2>
                        
                        <!-- Create JD Form -->
                        <div class="glass-card mb-4">
                            <h4 class="fw-bold text-light mb-3"><i class="bi bi-plus-circle text-success me-2"></i>Create Job Description</h4>
                            <form id="jdForm" onsubmit="createJobDescription(event)">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Job Title</label>
                                        <input type="text" id="jdTitle" class="form-control" placeholder="e.g. Senior Python Developer" required />
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Department</label>
                                        <input type="text" id="jdDepartment" class="form-control" placeholder="e.g. Engineering" required />
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block">Creation Method</label>
                                    <div class="d-flex gap-4 mt-1 mb-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="jdMethod" id="jdMethodText" value="text" checked onchange="toggleJDMethod('text')">
                                            <label class="form-check-label" for="jdMethodText" style="cursor: pointer; color: var(--text-secondary);">
                                                Manual Text Input
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="jdMethod" id="jdMethodFile" value="file" onchange="toggleJDMethod('file')">
                                            <label class="form-check-label" for="jdMethodFile" style="cursor: pointer; color: var(--text-secondary);">
                                                File Upload (PDF/TXT)
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3" id="jdTextGroup">
                                    <label class="form-label">Job Description / Requirements</label>
                                    <textarea id="jdDescription" class="form-control" rows="4" placeholder="Describe the role requirements, skills, and qualifications..." required></textarea>
                                </div>
                                <div class="mb-3" id="jdFileGroup" style="display: none;">
                                    <label class="form-label">Upload Job Description File</label>
                                    <input type="file" id="jdFile" class="form-control" accept=".pdf,.txt" />
                                </div>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i> Create Job Description</button>
                            </form>
                        </div>

                        <!-- Candidate Matching Results Sub-panel -->
                        <div id="jdMatchPanel" class="glass-card mb-4" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center">
                                <h4 class="m-0 text-light fw-bold" id="jdMatchTitle"><i class="bi bi-bullseye text-success me-2"></i>Candidate Matches</h4>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-success" onclick="exportJDMatches()"><i class="bi bi-download me-1"></i> Export CSV</button>
                                    <button class="btn btn-sm btn-danger" onclick="closeJDMatches()"><i class="bi bi-x-circle me-1"></i> Close</button>
                                </div>
                            </div>
                            <div id="jdMatchResults" class="mt-3">
                                <p class="text-muted">Calculating matches...</p>
                            </div>
                        </div>

                        <!-- Active Job Descriptions list -->
                        <div class="glass-card">
                            <h4 class="fw-bold text-light mb-4"><i class="bi bi-collection text-success me-2"></i>Active Job Descriptions</h4>
                            <div id="jdsList">
                                <p class="text-muted">Loading job descriptions...</p>
                            </div>
                        </div>
                    </div>
