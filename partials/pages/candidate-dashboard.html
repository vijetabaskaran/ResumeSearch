<!-- =======================================
                         F. CANDIDATE DASHBOARD PAGE
                         ======================================= -->
                    <div id="candidate-dashboard-page" class="page">
                        <h2 class="section-title fw-bold text-light mb-4"><i class="bi bi-speedometer2 me-2 text-info"></i>Candidate Dashboard</h2>
                        
                        <div class="row mb-5">
                            <!-- Dynamic Card: Open Roles Count -->
                            <div class="col-md-6 mb-4">
                                <div class="metric-card">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h5 class="text-uppercase m-0">Open Job Roles</h5>
                                            <h2 id="candidateOpenRolesCount" class="mt-2 text-white">0</h2>
                                        </div>
                                        <div class="metric-icon-box text-info"><i class="bi bi-briefcase"></i></div>
                                    </div>
                                    <div class="mt-3" style="font-size: 13px; color: var(--text-secondary);">
                                        <span><i class="bi bi-check-circle-fill text-success me-1"></i> Roles currently available for matches</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Dynamic Card: Department Count -->
                            <div class="col-md-6 mb-4">
                                <div class="metric-card">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h5 class="text-uppercase m-0">Active Departments</h5>
                                            <h2 id="candidateDeptCount" class="mt-2 text-success">0</h2>
                                        </div>
                                        <div class="metric-icon-box text-success"><i class="bi bi-building"></i></div>
                                    </div>
                                    <div class="mt-3" style="font-size: 13px; color: var(--text-secondary);">
                                        <span><i class="bi bi-info-circle-fill text-info me-1"></i> Unique functional teams hiring</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Available Job Roles Table List -->
                        <div class="glass-card">
                            <h4 class="fw-bold text-light mb-4"><i class="bi bi-grid-3x3-gap text-info me-2"></i>Active Job Roles & Descriptions</h4>
                            <div id="candidateJdList">
                                <p class="text-muted">Loading available roles...</p>
                            </div>
                        </div>

                        <!-- Messages & Replies List -->
                        <div class="glass-card mt-5">
                            <h4 class="fw-bold text-light mb-4"><i class="bi bi-chat-left-text text-info me-2"></i>My Messages & Recruiter Replies</h4>
                            <div id="candidateRepliesList">
                                <p class="text-muted">Loading messages and replies...</p>
                            </div>
                        </div>
                    </div>
