<!-- =======================================
                         H. CANDIDATE MESSAGE SUPPORT PAGE
                         ======================================= -->
                    <div id="candidate-support-page" class="page">
                        <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
                            <h2 class="section-title fw-bold text-light mb-2"><i class="bi bi-envelope text-info me-2"></i>Contact Recruitment / Support</h2>
                            <p class="text-secondary mb-4">
                                Send a message or inquiry directly to our recruitment officials.
                            </p>
                            <form id="emailForm" onsubmit="sendHREmail(event)">
                                <div class="mb-3">
                                    <label class="form-label">Subject</label>
                                    <input type="text" id="emailSubject" class="form-control" placeholder="Enter message subject (e.g. Inquiry regarding openings)" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Message Details</label>
                                    <textarea id="emailMessage" class="form-control" rows="6" placeholder="Type your detailed message here..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-3">
                                    <i class="bi bi-send me-2"></i> Send Message to HR
                                </button>
                            </form>
                        </div>
                    </div>
