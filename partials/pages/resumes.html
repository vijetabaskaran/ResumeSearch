<!-- =======================================
                         C. RESUMES MANAGEMENT PAGE (OFFICIAL)
                         ======================================= -->
                    <div id="resumes-page" class="page">
                        <h2 class="section-title fw-bold text-light mb-4"><i class="bi bi-file-earmark-person text-info me-2"></i>Resumes Management</h2>
                        
                        <!-- Search Box Section -->
                        <div class="glass-card mb-4">
                            <h4 class="fw-bold text-light mb-3"><i class="bi bi-search text-info me-2"></i>Semantic Skill Search</h4>
                            <p class="text-secondary mb-4">Perform advanced semantic search across the entire resume vector database to find candidates matching specific skills.</p>
                            <div class="d-flex gap-3">
                                <input type="text" id="skillSearch" class="form-control" placeholder="Search skill (e.g. Python Developer, Kubernetes, UI designer...)" />
                                <button class="btn btn-success px-4" onclick="searchSkill()">
                                    <i class="bi bi-search me-2"></i> Search Resumes
                                </button>
                            </div>
                            
                            <!-- Search Results Container -->
                            <div id="searchResults" class="mt-4"></div>
                        </div>

                        <!-- Main Table List Section -->
                        <div class="glass-card">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h4 class="fw-bold text-light m-0"><i class="bi bi-list-stars text-info me-2"></i>Received Candidates</h4>
                                <button class="btn btn-primary btn-sm" onclick="loadOfficialResumes()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
                            </div>
                            <div id="resumesReceivedList">
                                <p class="text-muted">Loading received resumes...</p>
                            </div>
                        </div>
                    </div>
