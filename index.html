    <!-- Remote Browser Log Debugger -->
    <script>
        (function() {
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;

            async function sendLogToServer(level, args) {
                try {
                    const message = Array.from(args).map(arg => {
                        if (typeof arg === 'object') {
                            try { return JSON.stringify(arg); } catch(e) { return String(arg); }
                        }
                        return String(arg);
                    }).join(' ');

                    await fetch("http://127.0.0.1:8000/api/log", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ level, message })
                    });
                } catch (e) {
                    // Suppress to avoid infinite loops
                }
            }

            console.log = function() {
                originalLog.apply(console, arguments);
                sendLogToServer('log', arguments);
            };

            console.warn = function() {
                originalWarn.apply(console, arguments);
                sendLogToServer('warn', arguments);
            };

            console.error = function() {
                originalError.apply(console, arguments);
                sendLogToServer('error', arguments);
            };

            window.addEventListener('error', function(event) {
                sendLogToServer('error', [`Uncaught Error: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`]);
            });

            window.addEventListener('unhandledrejection', function(event) {
                sendLogToServer('error', [`Unhandled Promise Rejection: ${event.reason}`]);
            });
        })();
    </script>
